name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      VITE_SUPABASE_URL: https://kfvqaklqencuwdtuqfey.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_ZpiSMhNlY26MXvwRGtqeQA_thdLspSe
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        id: cf_deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist --project-name=cnh-pista > /tmp/wrangler-output.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/wrangler-output.log

      - name: Post redacted diagnostic log if it failed
        if: steps.cf_deploy.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue_body=$(python3 -c "
          import json, re
          with open('/tmp/wrangler-output.log') as f:
              content = f.read()
          content = re.sub(r'Bearer\s+\S+', 'Bearer [REDACTED]', content)
          content = re.sub(r'cfut_[A-Za-z0-9_-]+', '[REDACTED_TOKEN]', content)
          content = re.sub(r'[A-Za-z0-9_-]{28,}', '[REDACTED]', content)
          print(json.dumps({'title': 'wrangler deploy diagnostic', 'body': '\`\`\`\n' + (content or '(empty output)') + '\n\`\`\`'}))
          ")
          curl -sS -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/issues -d "$issue_body"
          exit 1
